name: CI pipeline 

on: 
    push: 
        branches:
            - main 
    pull_request:
        branches: 
            - main 
jobs:
    build:
        runs-on: ubuntu-latest
        steps: 
            - name: Checkout code 
              uses: actions/checkout@v4
            
            - name: setup node.js 
              uses: actions/setup-node@v3
              with:
                node-version: 22 
                cache: npm 

            - name:  Install dependencies
              run: npm ci 

            - name: Run tests 
              run: npm test
            
            - name: Build docker image 
              run: docker build -t docker-cicd-app:latest .